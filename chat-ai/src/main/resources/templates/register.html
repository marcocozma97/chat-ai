<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrati - Chat AI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>Chat AI</h1>
    <p class="subtitle">Crea il tuo account</p>

    <div id="messaggio" class="alert" style="display:none;"></div>

    <form id="formRegister">
        <label>Username</label>
        <input type="text" id="username" required/>
        <label>Email</label>
        <input type="email" id="email" required/>
        <label>Password</label>
        <input type="password" id="password" required/>
        <button type="submit" class="btn-primary btn-block">Registrati</button>
    </form>

    <p class="switch">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
</div>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
