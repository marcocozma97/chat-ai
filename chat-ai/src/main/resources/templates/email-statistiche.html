<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <title>Le tue statistiche</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family: Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
    <tr>
        <td align="center">

            <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">

                <!-- Intestazione -->
                <tr>
                    <td style="background-color:#1a1f4b; padding:28px 32px;">
                        <h1 style="margin:0; color:#ffffff; font-size:22px;">Chat AI</h1>
                        <p style="margin:6px 0 0; color:#a9b0d6; font-size:14px;">Il riepilogo delle tue statistiche</p>
                    </td>
                </tr>

                <!-- Saluto -->
                <tr>
                    <td style="padding:28px 32px 8px;">
                        <p style="margin:0; color:#333333; font-size:16px;">
                            Ciao <strong th:text="${username}">utente</strong>,
                        </p>
                        <p style="margin:12px 0 0; color:#555555; font-size:14px; line-height:22px;">
                            ecco le statistiche aggiornate della piattaforma.
                        </p>
                    </td>
                </tr>

                <!-- Statistiche -->
                <tr>
                    <td style="padding:16px 32px 8px;">

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:12px; background-color:#f4f5f7; border-radius:8px;">
                            <tr>
                                <td style="padding:16px 20px; color:#555555; font-size:14px;">Messaggi inviati</td>
                                <td align="right" style="padding:16px 20px; color:#1a1f4b; font-size:22px; font-weight:bold;" th:text="${messaggiInviati}">0</td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:12px; background-color:#f4f5f7; border-radius:8px;">
                            <tr>
                                <td style="padding:16px 20px; color:#555555; font-size:14px;">Messaggi ricevuti</td>
                                <td align="right" style="padding:16px 20px; color:#1a1f4b; font-size:22px; font-weight:bold;" th:text="${messaggiRicevuti}">0</td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; border-radius:8px;">
                            <tr>
                                <td style="padding:16px 20px; color:#555555; font-size:14px;">Chat aperte</td>
                                <td align="right" style="padding:16px 20px; color:#1a1f4b; font-size:22px; font-weight:bold;" th:text="${chatAperte}">0</td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Piè di pagina -->
                <tr>
                    <td style="padding:24px 32px 32px;">
                        <p style="margin:0; color:#999999; font-size:12px; line-height:18px;">
                            Questa email è stata generata automaticamente dal progetto Chat AI.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
